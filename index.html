<body>
<header class="sr-only">
  <h1>Agent Grand Prix</h1>
  <p>A free browser racing game: build your AI racing team, name your drivers, call the strategy and race on circuits around the world.</p>
</header>
<noscript><p class="noscript">Agent Grand Prix runs in your browser and needs JavaScript and WebGL turned on.</p></noscript>
<div id="app" class="app">
  <aside id="tower" class="tower panel" aria-label="Race order">
    <div class="tower-head"><span>Order</span><button id="gapMode" class="mini" type="button">Interval</button></div>
    <ol id="towerList" class="tower-list"></ol>
  </aside>

  <main id="stage" class="stage">
    <canvas id="gl" aria-label="Race view. Tap a car to follow it."></canvas>
    <div id="hud" class="hud" hidden>
      <div class="hud-left">
        <button id="menuBtn" class="chip icon" type="button" aria-label="Pause and menu">☰</button>
        <div class="chip venue"><span id="hudFlag"></span><span id="hudCity"></span></div>
        <div class="chip lap">LAP <b id="hudLap">1</b>/<span id="hudLaps">8</span></div>
      </div>
      <div class="hud-right">
        <div class="chip wx" id="hudWx"></div>
        <button id="soundBtn" class="chip icon" type="button" aria-label="Sound">🔊</button>
        <button id="agentsBtn" class="chip agents" type="button" hidden>Hand to agents</button>
        <div class="seg speed" role="group" aria-label="Race speed">
          <button type="button" data-speed="1" class="on">1×</button><button type="button" data-speed="2">2×</button><button type="button" data-speed="4">4×</button><button type="button" data-speed="8" class="fast">8×</button><button type="button" data-speed="16" class="fast">16×</button>
        </div>
      </div>
    </div>
    <div id="camPill" class="cam-pill seg" role="group" aria-label="Camera" hidden>
      <button type="button" data-cam="live" class="on">Live</button><button type="button" data-cam="overview">Overview</button><button type="button" data-cam="chase">Chase</button><button type="button" data-cam="fpv">Cockpit</button><button type="button" data-cam="tv">TV</button><button type="button" data-cam="pit">Pit</button>
    </div>
    <div id="follow" class="follow" hidden></div>
    <div id="drivers" class="drivers" hidden aria-label="Your two cars"></div>
    <div id="suggest" class="suggest" hidden aria-live="polite"></div>
    <div id="ack" class="ack" hidden aria-live="polite"></div>
    <button id="boost" class="boost" type="button" hidden aria-label="ERS boost"><b>BOOST</b><span><i></i></span><small></small></button>
    <button id="boxBtn" class="boxfab" type="button" hidden aria-label="Box this lap"><b>BOX</b><small></small></button>
    <button id="talkBtn" class="talkfab" type="button" hidden aria-label="Team radio: hold and speak to your drivers" title="Hold and speak (or hold T)"><b>🎙</b><small>HOLD TO TALK</small></button>
    <div id="talkSaid" class="talk-said" hidden aria-live="polite"></div>
    <div id="stats" class="chips4" hidden></div>
    <ol id="pitline" class="pitline" hidden aria-label="Pit stop">
      <li>Box call</li><li>Pit entry</li><li>Stationary</li><li>Release</li><li>Back on track</li>
    </ol>
    <div class="chip sc scbar" id="hudSc" hidden></div>
    <div id="toast" class="toast" aria-live="polite"></div>
    <div id="coach" class="coach" hidden aria-live="polite"></div>
    <div id="lesson" class="coach lesson" hidden aria-live="polite"></div>
    <div id="lights" class="lights" hidden><i></i><i></i><i></i><i></i><i></i></div>
  </main>

  <nav class="tabs" id="tabs" role="tablist">
    <button type="button" id="grip" class="grip" aria-label="Open or close the panel"><i></i></button>
    <button type="button" data-tab="wall" class="on">Strategy</button>
    <button type="button" data-tab="order">Timing</button>
    <button type="button" data-tab="radio">Radio <span id="radioDot" class="dot" hidden></span></button>
  </nav>
  <aside id="wall" class="wall panel" aria-label="Pit wall">
    <section id="carCard" class="card car-card"></section>
    <section id="controls" class="controls"></section>
    <section class="radio-wrap">
      <div class="sub radio-head">Team radio <button type="button" id="voiceBtn" class="vbtn" aria-label="Change the radio voice">🎙 <span id="voiceName"></span></button></div>
      <ol id="radio" class="radio"></ol>
    </section>
  </aside>
</div>

<!-- screens -->
<div id="screen" class="screen" hidden>
  <div class="sheet" id="sheet"></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
