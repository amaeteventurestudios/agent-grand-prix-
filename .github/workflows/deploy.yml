# Puts the game website and the WhatsApp agent on your server whenever main changes.
# One-time setup, in the repo's Settings > Secrets and variables > Actions:
#   Secrets:
#     SERVER_HOST           the server's public IP address
#     SERVER_USER           the login name (ubuntu or opc on Oracle Cloud)
#     SERVER_SSH_KEY        the whole private key file Oracle gave you (BEGIN ... END lines included)
#     WHATSAPP_AGENT_TOKEN  the agent's API key from WhatsApp (Chat info > API key); optional:
#                           without it only the website goes up
#     TYPESAFE_API_KEY      optional: a key from console.typesafe.ai/keys switches on the Jev interpreter for team
#                           radio phrases the game's own matcher can't place. Without it voice calls still work.
#     ANTHROPIC_API_KEY     optional: switches on the drivers' AI brain (free conversation with your drivers).
#                           Without it the drivers answer from the rules brain.
#   Variables (optional):
#     SITE_DOMAIN           the game's domains, main one first (default: agentgrandprix.com www.agentgrandprix.com). The
#                           site gets HTTPS by itself; leave it out and the site answers on http://<IP>
name: Deploy to server
on:
  push:
    branches: [main]
    paths: ['agent/**', 'tools/build-site.sh', 'js/**', 'css/**', 'assets/**', 'vendor/**', 'index.html', 'credits.html', 'favicon.ico', 'robots.txt', 'sitemap.xml', 'llms.txt', 'site.webmanifest', 'server/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check the race engine still runs
        run: node agent/selftest.mjs
      - name: Build the site (minify the game's code)
        run: bash tools/build-site.sh
      - name: Copy to the server and (re)start the services
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          KEY: ${{ secrets.SERVER_SSH_KEY }}
          TOKEN: ${{ secrets.WHATSAPP_AGENT_TOKEN }}
          JEV: ${{ secrets.TYPESAFE_API_KEY }}
          BRAIN: ${{ secrets.ANTHROPIC_API_KEY }}
          NOVENIQUE: ${{ vars.NOVENIQUE_URL || 'https://accounts.129-146-26-28.sslip.io' }}   # Novenique Core's public address; set the variable to change it
          DOMAIN: ${{ vars.SITE_DOMAIN || 'agentgrandprix.com www.agentgrandprix.com' }}
        run: |
          set -euo pipefail
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then echo '::error::Add the SERVER_HOST, SERVER_USER and SERVER_SSH_KEY secrets first.'; exit 1; fi
          # Forgive extra words pasted into the secrets: keep just the address, the login and the key block
          HOST=$(printf '%s' "$HOST" | grep -oE '[0-9]{1,3}(\.[0-9]{1,3}){3}|[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+' | tail -1)
          USER=$(printf '%s' "$USER" | grep -oE '[a-z_][a-z0-9_-]*' | tail -1); USER="${USER:-ubuntu}"
          install -m 600 /dev/null key && printf '%s\n' "$KEY" | tr -d '\r' | sed -n '/-----BEGIN/,/-----END/p' > key
          [ -s key ] || { echo '::error::SERVER_SSH_KEY should hold the whole key file, from the -----BEGIN line to the -----END line.'; exit 1; }
          OPTS="-i key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          tar czf app.tgz agent js server package.json
          tar czf site.tgz -C dist .
          scp $OPTS app.tgz site.tgz "$USER@$HOST:/tmp/"
          MAIN="${DOMAIN%% *}"; SITE_URL="${MAIN:+https://$MAIN}"; SITE_URL="${SITE_URL:-http://$HOST}"
          JEV=$(printf '%s' "$JEV" | tr -d ' \r\n'); BRAIN=$(printf '%s' "$BRAIN" | tr -d ' \r\n')
          NOVQ=$(printf '%s' "$NOVENIQUE" | tr -d ' \r\n')
          printf 'WHATSAPP_AGENT_TOKEN=%s\nSTATE_FILE=%s\nSITE_URL=%s\nTYPESAFE_API_KEY=%s\nANTHROPIC_API_KEY=%s\nNOVENIQUE_URL=%s\n' "$TOKEN" '/var/lib/agp/state.json' "$SITE_URL" "$JEV" "$BRAIN" "$NOVQ" | ssh $OPTS "$USER@$HOST" 'umask 077; cat > /tmp/agp.env'
          ssh $OPTS "$USER@$HOST" "SITE_DOMAIN='$DOMAIN' bash -s" < server/install.sh
          rm -f key
          echo "::notice::Live at $SITE_URL"
      - name: Check the site answers
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          DOMAIN: ${{ vars.SITE_DOMAIN || 'agentgrandprix.com www.agentgrandprix.com' }}
        run: |
          HOST=$(printf '%s' "$HOST" | grep -oE '[0-9]{1,3}(\.[0-9]{1,3}){3}|[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+' | tail -1)
          MAIN="${DOMAIN%% *}"; URL="${MAIN:+https://$MAIN}"; URL="${URL:-http://$HOST}"
          for i in 1 2 3 4 5 6; do curl -fsS -m 10 -o /dev/null "$URL/" && { echo "OK: $URL"; exit 0; }; sleep 5; done
          echo "::warning::The server is running but $URL can't be reached from outside. Open ports 80 and 443 in the Oracle Cloud console (Networking > Virtual cloud networks > your VCN > Security Lists > Default > Add Ingress Rules: source 0.0.0.0/0, TCP, destination ports 80,443)."
